name: Import Clonagram

on:
  push:
    branches:
      - clonagram-import

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: clonagram-import

      - name: Import Clonagram source
        run: |
          set -e
          rm -rf /tmp/Clonagram
          git clone --depth 1 https://github.com/zivavu/Clonagram.git /tmp/Clonagram
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/Clonagram/. .
          rm -f .github/workflows/import-clonagram.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Import Clonagram application"
          git push origin HEAD:clonagram-import
